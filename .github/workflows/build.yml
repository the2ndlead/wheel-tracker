# Builds the Mac (Apple Silicon) and Windows installers on GitHub's own machines.
# Run it from the repo's Actions tab ("Build installers" → Run workflow), or push a tag like v0.3.0.
# The installers appear as downloadable artifacts on the run's page.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon runner
            target: --mac --arm64
            files: release/*.dmg
          - os: windows-latest
            target: --win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-tracker-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
